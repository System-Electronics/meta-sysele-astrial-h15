header:
  version: 11

# Override for cached dev builds only (dev-build.yml workflow). Moves
# sstate-cache and downloads outside <build>/, matching YOCTO_CACHE_ROOT in
# the workflow. Not included by the scheduled canary or the bump workflow
# (both run no-cache).
local_conf_header:
  cache_config: |
    SSTATE_DIR = "${TOPDIR}/../../yocto-cache/sstate-cache"
    DL_DIR = "${TOPDIR}/../../yocto-cache/downloads"
