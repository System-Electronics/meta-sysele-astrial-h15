name: Astrial H15 Dev Build (cached)

run-name: Astrial H15 Dev Build • ${{ inputs.ref || github.ref_name }}

# Cheap dev build: uses the GitHub Actions Cache (sstate + downloads) to
# rebuild only the delta (~90 min -> ~15-20 min). Publishes no tags/releases,
# only the run's ephemeral artifacts. Manual trigger to control cost.
#
# To build an experimental branch, dispatch FROM master and put the branch
# in `ref`. GitHub's cache is only readable by the branch that created it and
# by the default branch: starting from master lets all experimental branches
# share one cache instead of each warming its own. Official builds run with
# use_cache=false and never read from this cache.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to build using master's shared cache. Leave empty to build the branch selected above with its own cache."
        type: string
        required: false
        default: ''
      sbom:
        description: "none (come sempre); standard = SPDX + cve-check. Attenzione: a cache calda i documenti SPDX arrivano da sstate e non vengono rigenerati, il controllo vero lo fa la build di tag."
        type: choice
        required: false
        default: 'none'
        options:
          - none
          - standard
          - full

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      release: none
      use_cache: true
      ref: ${{ inputs.ref }}
      sbom: ${{ inputs.sbom }}
    secrets: inherit
