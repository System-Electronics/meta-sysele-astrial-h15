name: Auto-bump poky (kirkstone point-release)

# Monthly schedule: checks for a newer yocto-4.0.x point-release than the
# current pin in kas/astrial-h15-machine.yml. If found, opens a bump PR and
# validates it with an end-to-end build (no-cache, no-release) in the same run.
# No auto-merge, no push to master: merge is manual, only after a green
# validation. Point-releases within kirkstone (4.0.x) only, never crossing
# the LTS branch.
on:
  schedule:
    - cron: '0 3 1 * *'   # first of the month, 03:00 UTC (default branch only)
  workflow_dispatch:

jobs:
  detect-and-open:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      new_tag: ${{ steps.bump.outputs.new_tag }}
      branch: ${{ steps.bump.outputs.branch }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Detect newer poky tag and open bump PR
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          KAS=kas/astrial-h15-machine.yml

          # Ultimo point-release 4.0.x pubblicato su poky.
          LATEST=$(git ls-remote --tags https://git.yoctoproject.org/poky \
            | grep -oP 'yocto-4\.0\.\d+$' | sort -V | tail -1)
          # Pin attuale nel nostro kas (override sul pin di hailo).
          CURRENT=$(grep -oP 'refspec:\s*\Kyocto-4\.0\.\d+' "$KAS" | head -1)

          echo "Pin attuale: ${CURRENT:-<nessuno>} | ultimo upstream: ${LATEST:-<nessuno>}"

          if [ -z "$LATEST" ] || [ -z "$CURRENT" ]; then
            echo "::warning::Impossibile determinare i tag (LATEST='$LATEST' CURRENT='$CURRENT'). Salto."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEWEST=$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | tail -1)
          if [ "$LATEST" = "$CURRENT" ] || [ "$NEWEST" != "$LATEST" ]; then
            echo "Already up to date ($CURRENT). Nothing to do."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="bump/poky-${LATEST#yocto-}"   # e.g. bump/poky-4.0.36
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists on origin, skipping (PR likely already open)."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Aggiorna SOLO il refspec poky nel nostro kas (mai commit raw, mai altri layer).
          sed -i -E "s/refspec: *yocto-4\.0\.[0-9]+/refspec: ${LATEST}/" "$KAS"
          git diff -- "$KAS"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "ci: bump poky ${CURRENT} -> ${LATEST}"
          git push origin "$BRANCH"

          gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "$BRANCH" \
            --title "ci: bump poky to ${LATEST}" \
            --body "$(cat <<EOF
          Automatic poky pin bump in \`${KAS}\`: **${CURRENT} → ${LATEST}** (kirkstone point-release).

          - Only the \`repos: poky: refspec:\` field changed. \`meta-hailo\` stays at \`kirkstone_v5.3.0\`.
          - An end-to-end validation build (no-cache, no-release) starts **in this same run**.
          - **Do not merge** until the \`✅ Bump poky ${LATEST} validated\` comment appears and the \`poky-bump-validation\` status is green.

          🤖 Generated with [Claude Code](https://claude.com/claude-code)
          EOF
          )"

          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "new_tag=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

  # Validation: same build as a release, but publishes nothing, on the bump branch.
  validate:
    needs: detect-and-open
    if: needs.detect-and-open.outputs.bumped == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      release: none
      use_cache: false
      ref: ${{ needs.detect-and-open.outputs.branch }}
    secrets: inherit

  report:
    needs: [detect-and-open, validate]
    if: always() && needs.detect-and-open.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Report validation result on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.detect-and-open.outputs.new_tag }}
          BRANCH: ${{ needs.detect-and-open.outputs.branch }}
          RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHA=$(gh pr view "$BRANCH" --json headRefOid -q .headRefOid)

          if [ "$RESULT" = "success" ]; then
            MSG="✅ Bump poky ${TAG} validated: build completed with no errors."
            STATE=success
            {
              echo "## ✅ Bump poky ${TAG} validated"
              echo "Build completed with no errors on branch \`${BRANCH}\`. Safe to merge after review."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            MSG="❌ Bump poky ${TAG}: validation build FAILED (${RESULT}). Do not merge."
            STATE=failure
            {
              echo "## ❌ Bump poky ${TAG} NOT validated"
              echo "Validation build failed (\`${RESULT}\`) on branch \`${BRANCH}\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "[Run log](${RUN_URL})" >> "$GITHUB_STEP_SUMMARY"

          gh pr comment "$BRANCH" --body "${MSG} [Run](${RUN_URL})"
          gh api "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state="${STATE}" \
            -f context="poky-bump-validation" \
            -f target_url="${RUN_URL}" \
            -f description="${MSG:0:130}"
