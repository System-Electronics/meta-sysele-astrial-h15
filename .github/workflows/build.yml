name: Astrial H15 Yocto Build (reusable)

# Reusable build. One place for the build logic; callers decide:
#   release   -> what to publish: none, continuous, or tagged
#   use_cache -> whether to use GitHub Actions Cache for SSTATE_DIR + DL_DIR (dev builds)
#   ref       -> branch/commit to build (used by the bump workflow to validate bump/* branches)
#
# Three release channels:
#   none        ephemeral run artifacts only. Dev builds and bump validation.
#   continuous  overwrites the single "continuous" prerelease: same URL for the
#               latest build, no new tag, no accumulation.
#   tagged      a real release on the tag that triggered the workflow (v1.2.0, v1.2.0-rc1).
on:
  workflow_call:
    inputs:
      release:
        description: "none = artifacts only; continuous = overwrite the continuous prerelease; tagged = release on the tag."
        type: string
        default: 'none'
      use_cache:
        description: "If true, use GitHub Actions Cache for sstate-cache + downloads (dev builds)."
        type: boolean
        default: false
      sbom:
        description: "none = nothing; standard = SPDX + cve-check; full = also includes checksums."
        type: string
        default: 'none'
      ref:
        description: "Branch/commit to build. Empty = the ref that triggered the workflow."
        type: string
        required: false
        default: ''

jobs:
  build:
    runs-on: self-hosted
    # Permissions are declared by the caller workflow, not here.
    env:
      # Must match ${TOPDIR}/../../yocto-cache used in kas/astrial-h15-cache.yml.
      YOCTO_CACHE_ROOT: ${{ github.workspace }}/yocto-cache
    steps:
      - name: Configure environment
        run: |
          echo "BB_ISOLATE_NETWORK=0" >> $GITHUB_ENV
          echo "BB_NO_NETWORK=0" >> $GITHUB_ENV

      - name: Install KAS
        run: |
          # The runner user has no root privileges; system packages are
          # provisioned separately ahead of time. Only the Python venv for
          # kas is created here.
          python3 -m venv "$RUNNER_TEMP/kas-venv"
          "$RUNNER_TEMP/kas-venv/bin/pip" install "kas==5.3"
          echo "$RUNNER_TEMP/kas-venv/bin" >> "$GITHUB_PATH"

      - name: Clean leftovers of previous runs
        run: |
          # The runner is persistent, so the workspace survives between
          # runs. yocto-cache/ is left untouched.
          rm -rf meta-hailo-soc release-files failure-logs /tmp/failed.txt /tmp/failed-recipes.txt

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: meta-sysele-bsp
          # Empty ref = checkout the ref that triggered the workflow.
          ref: ${{ inputs.ref }}

      - name: Persistent Yocto cache on the runner
        # ~/yocto-cache/h15 lives outside _work, so it survives a workspace
        # cleanup or runner re-registration. A symlink keeps it reachable at
        # the workspace path used by kas/astrial-h15-cache.yml.
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          PERSIST="$HOME/yocto-cache/h15"
          mkdir -p "$PERSIST"
          ln -sfn ../cve-db "$PERSIST/CVE_CHECK"
          # First run: migrate a real (non-symlink) cache already in the workspace.
          if [ -d yocto-cache ] && [ ! -L yocto-cache ]; then
            for d in sstate-cache downloads CVE_CHECK; do
              [ -d "yocto-cache/$d" ] || continue
              if [ -e "$PERSIST/$d" ]; then
                echo "WARN: $PERSIST/$d already exists, leaving yocto-cache/$d in place"
              else
                mv "yocto-cache/$d" "$PERSIST/$d"
              fi
            done
            rmdir yocto-cache 2>/dev/null || mv yocto-cache "yocto-cache.old.$(date +%s)"
          fi
          ln -sfn "$PERSIST" yocto-cache
          ls -ld yocto-cache
          du -sh "$PERSIST"/* 2>/dev/null || true
          df -h "$PERSIST" | tail -1

      - name: Setup Build Environment
        run: |
          # Clone the official Hailo 1.12 repository
          git clone --branch 1.12.0 --single-branch \
            https://github.com/hailo-ai/meta-hailo-soc.git
          cd meta-hailo-soc

          # Copy the checked out meta-sysele-bsp into the correct location
          cp -r ../meta-sysele-bsp ./meta-sysele-bsp

          # Genera il kas CI. L'ultimo include (astrial-h15-machine.yml) porta il pin poky.
          cat > astrial-h15-ci.yml <<'EOF'
          header:
            version: 11
            includes:
              - kas/yocto-base.yml
              - meta-sysele-bsp/kas/astrial-h15-vpu-base.yml
              - kas/targets/hailo-soc-target-core-image-hailo-dev.yml
              - meta-sysele-bsp/kas/astrial-h15-machine.yml
          EOF

          # Dev builds only: add the override that moves SSTATE_DIR/DL_DIR under
          # ${TOPDIR}/../../yocto-cache, so they can be cached by Actions Cache.
          if [ "${{ inputs.use_cache }}" = "true" ]; then
            echo "    - meta-sysele-bsp/kas/astrial-h15-cache.yml" >> astrial-h15-ci.yml
            echo "Cache override enabled (astrial-h15-cache.yml)"
          fi

          cat >> astrial-h15-ci.yml <<'EOF'

          build_system: openembedded
          EOF

          echo "===== astrial-h15-ci.yml generato ====="
          cat astrial-h15-ci.yml

          # Create secure boot keypair from GitHub secret (with security measures)
          if [ "${{ secrets.HAILO_CUSTOMER_KEYPAIR }}" != "" ]; then
            # Create keypair file with restricted permissions
            echo "${{ secrets.HAILO_CUSTOMER_KEYPAIR }}" > meta-sysele-bsp/recipes-bsp/hailo-secureboot-assets/files/customer_keypair.pem
            chmod 600 meta-sysele-bsp/recipes-bsp/hailo-secureboot-assets/files/customer_keypair.pem
            echo "Secure boot keypair created from secret"
          else
            echo "Warning: HAILO_CUSTOMER_KEYPAIR secret not found - secure boot will be disabled"
            # Create empty file to prevent build errors
            touch meta-sysele-bsp/recipes-bsp/hailo-secureboot-assets/files/customer_keypair.pem
          fi

          # Initialize submodules
          git submodule update --init --recursive

      - name: Create Patch for BitBake Network Isolation
        run: |
          cd meta-hailo-soc

          # Find the BitBake worker script path
          BB_WORKER=$(find . -name "bitbake-worker" -type f | head -n 1)
          if [ -n "$BB_WORKER" ]; then
            echo "Found BitBake worker at $BB_WORKER"
            # Backup the original file
            cp "$BB_WORKER" "$BB_WORKER.orig"
            # Patch the file to disable network isolation
            sed -i 's/bb.utils.disable_network(uid, gid)/# Network isolation disabled for CI build/' "$BB_WORKER"
            echo "Patched BitBake worker successfully"
          else
            echo "Warning: Could not find BitBake worker script"
          fi

          # Find the BitBake utils.py file
          BB_UTILS=$(find . -name "utils.py" -path "*/bitbake/lib/bb/*" -type f | head -n 1)
          if [ -n "$BB_UTILS" ]; then
            echo "Found BitBake utils.py at $BB_UTILS"
            # Backup the original file
            cp "$BB_UTILS" "$BB_UTILS.orig"
            # Patch the file to disable network isolation
            sed -i 's/def disable_network(uid, gid):/def disable_network(uid, gid):\n    return  # Function disabled for CI build/' "$BB_UTILS"
            echo "Patched BitBake utils.py successfully"
          else
            echo "Warning: Could not find BitBake utils.py"
          fi

      - name: Restore Yocto Cache (sstate + downloads)
        # Sul runner self-hosted sstate e downloads restano su disco in yocto-cache/.
        if: inputs.use_cache && runner.environment != 'self-hosted'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.YOCTO_CACHE_ROOT }}/sstate-cache
            ${{ env.YOCTO_CACHE_ROOT }}/downloads
          # Unique key per run plus prefix restore-keys: each run saves a new
          # cache entry and starts from the most recent one.
          key: yocto-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            yocto-cache-${{ runner.os }}-

      - name: Check the CVE database on the runner
        if: inputs.sbom != 'none' && runner.environment == 'self-hosted'
        run: |
          # Updated by the VPS timer. The build can proceed without it, but
          # a release with no CVE report must not pass unnoticed.
          DB="$YOCTO_CACHE_ROOT/CVE_CHECK/nvdcve_2-2.db"
          if [ ! -s "$DB" ]; then
            echo "::error::No CVE database at $DB: the VPS update timer has not produced one"
            exit 1
          fi
          AGE=$(( ( $(date +%s) - $(stat -c %Y "$DB") ) / 3600 ))
          echo "CVE database: $(du -h "$DB" | cut -f1), updated ${AGE} h ago"
          [ "$AGE" -le 48 ] || echo "::warning::CVE database is ${AGE} h old"

      - name: Restore the CVE database
        id: cve_db
        if: inputs.sbom != 'none' && runner.environment != 'self-hosted'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.YOCTO_CACHE_ROOT }}/CVE_CHECK
          # Separate cache, independent of use_cache: the NVD database is
          # not a build output.
          key: nvd-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-db-${{ runner.os }}-

      - name: Build Yocto Image with KAS
        run: |
          cd meta-hailo-soc

          # pseudo opens many file descriptors, one per client.
          ulimit -n 65536 || echo "WARN: could not raise the fd limit"
          echo "fd limit: $(ulimit -n) | cpu: $(nproc) | tar: $(tar --version | head -1)"

          # Set environment variables for network isolation
          export BB_ISOLATE_NETWORK=0
          export BB_NO_NETWORK=0

          # Human-readable BSP version, only set for a tagged release.
          if [ "${{ inputs.release }}" = "tagged" ]; then
            export SYSELE_BSP_VERSION="${{ github.ref_name }}"
          fi
          export SYSELE_SBOM="${{ inputs.sbom }}"
          # Used if the nvd-db cache is empty and the database needs downloading.
          export NVD_API_KEY="${{ secrets.NVD_API_KEY }}"

          # CI-specific build optimizations - reduce log verbosity
          export BITBAKE_UI_OPTS="-k"
          export BB_LOGCONFIG=""
          export BB_CONSOLELOG=""
          export BB_DEFAULT_TASK="build"
          export GITHUB_ACTIONS_BUILD=1  # Flag to detect CI environment

          export BB_ENV_PASSTHROUGH_ADDITIONS="NVD_API_KEY SYSELE_SBOM SYSELE_BSP_VERSION GITHUB_SHA GITHUB_REPOSITORY GITHUB_RUN_ID BB_ISOLATE_NETWORK BB_NO_NETWORK BITBAKE_UI_OPTS BB_LOGCONFIG BB_CONSOLELOG BB_DEFAULT_TASK GITHUB_ACTIONS_BUILD"

          # Build using KAS with our Astrial H15 configuration
          set -e  # Exit on any error
          if ! kas build astrial-h15-ci.yml -- -k; then
            echo "ERROR: KAS build failed"
            exit 1
          fi

      - name: Collect Failed Task Logs
        if: failure()
        run: |
          set +e
          BUILD=meta-hailo-soc/build
          mkdir -p failure-logs

          echo "===== cooker log, last 200 lines ====="
          COOKER=$(ls -t "$BUILD"/tmp/log/cooker/*/console-latest.log 2>/dev/null | head -1)
          [ -n "$COOKER" ] && tail -n 200 "$COOKER" || echo "(no cooker log)"

          echo "===== disk space / memory ====="
          df -h; free -h

          # 1) paths reported by bitbake
          find "$BUILD/tmp/log" -name '*.log' -exec \
            grep -h "Logfile of failure stored in:" {} + 2>/dev/null \
            | sed 's/.*stored in: //' | tr -d '\r' | sort -u > /tmp/failed.txt

          # 2) fallback: log.do_* files that contain a real error
          if [ ! -s /tmp/failed.txt ]; then
            echo "No 'Logfile of failure' found: scanning log.do_* for errors"
            find "$BUILD/tmp/work" -path '*/temp/log.do_*' -newermt '-6 hours' -print0 \
              | xargs -0 -r grep -lE '^(ERROR|FATAL):|Error [0-9]+$|\*\*\* \[' \
              | sort -u > /tmp/failed.txt
          fi

          echo "===== logs found ====="
          cat /tmp/failed.txt

          while read -r f; do
            [ -f "$f" ] || continue
            name=$(printf '%s' "$f" | sed 's|.*/tmp/work/||; s|/|_|g')
            cp "$f" "failure-logs/$name"
            run="${f/log.do_/run.do_}"
            [ -f "$run" ] && cp "$run" "failure-logs/${name/log.do_/run.do_}"
          done < /tmp/failed.txt

          grep -rlE "PRIVATE KEY|BEGIN .*KEY" failure-logs/ 2>/dev/null | xargs -r rm -f

          echo "===== raccolti ====="
          ls -la failure-logs/
          for f in failure-logs/*log.do_*; do
            [ -e "$f" ] || continue
            echo "===== $f ====="
            tail -n 120 "$f"
          done

          echo "===== ambiente ====="
          nproc; ulimit -n; ulimit -u; tar --version | head -1

          echo "===== pseudo.log ====="
          find "$BUILD/tmp/work" -name 'pseudo.log' -newermt '-6 hours' \
            | head -20 | while read -r p; do
              echo "----- $p -----"
              tail -n 60 "$p"
              cp "$p" "failure-logs/$(printf '%s' "$p" | sed 's|.*/tmp/work/||; s|/|_|g')"
            done

          exit 0

      - name: Retry Failed Packages Individually
        if: failure()
        run: |
          set +e
          cd meta-hailo-soc

          # ricava le ricette fallite dal cooker log
          COOKER=$(ls -t build/tmp/log/cooker/*/console-latest.log | head -1)
          grep -oP '^ERROR: \K[a-z0-9.+-]+(?=-[0-9][^ ]* do_package:)' "$COOKER" \
            | sort -u > /tmp/failed-recipes.txt

          echo "===== ricette da riprovare ====="
          cat /tmp/failed-recipes.txt

          PASS=0; FAIL=0
          while read -r r; do
            echo "----- retry: $r -----"
            if kas shell astrial-h15-ci.yml -c "bitbake -c package -f $r"; then
              echo "RETRY OK: $r"; PASS=$((PASS+1))
            else
              echo "RETRY KO: $r"; FAIL=$((FAIL+1))
            fi
          done < /tmp/failed-recipes.txt

          echo "===== esito: $PASS passate, $FAIL fallite ====="
          exit 0

      - name: Prune sstate cache
        if: always() && inputs.use_cache
        continue-on-error: true
        run: |
          # Keeps the sstate cache from growing unbounded. Best-effort, must
          # never break the build.
          SCRIPT=meta-hailo-soc/poky/scripts/sstate-cache-management.sh
          if [ -x "$SCRIPT" ] && [ -d "${YOCTO_CACHE_ROOT}/sstate-cache" ]; then
            "$SCRIPT" --cache-dir="${YOCTO_CACHE_ROOT}/sstate-cache" --remove-duplicated -y || true
            du -sh "${YOCTO_CACHE_ROOT}/sstate-cache" "${YOCTO_CACHE_ROOT}/downloads" 2>/dev/null || true
          else
            echo "Prune script or sstate-cache not found, skipping."
          fi

      - name: Save Yocto Cache (sstate + downloads)
        # Saved even on a failed build: partial sstate still speeds up the next
        # run. Best-effort: a save that fails once the cache quota is hit does
        # not break the workflow.
        if: always() && inputs.use_cache && runner.environment != 'self-hosted'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.YOCTO_CACHE_ROOT }}/sstate-cache
            ${{ env.YOCTO_CACHE_ROOT }}/downloads
          key: yocto-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Save the CVE database
        if: always() && inputs.sbom != 'none' && runner.environment != 'self-hosted'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.YOCTO_CACHE_ROOT }}/CVE_CHECK
          key: nvd-db-${{ runner.os }}-${{ github.run_id }}
        continue-on-error: true

      - name: Clean Sensitive Files Before Archiving
        run: |
          # Remove any private key files that might have been copied or generated during build
          find meta-hailo-soc/ -name "customer_keypair.pem" -delete || true
          find meta-hailo-soc/ -name "*.pem" -delete || true
          find meta-hailo-soc/ -name "*private*key*" -delete || true
          # Clean build logs that might contain sensitive information
          find meta-hailo-soc/build -name "*.log" -exec grep -l "PRIVATE\|SECRET\|KEY" {} \; -delete || true
          echo "Sensitive files cleaned before archiving"

      - name: Validate Release Artifacts
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY="meta-hailo-soc/build/tmp/deploy/images/astrial-h15"

          required_artifacts=(
            "core-image-hailo-dev-astrial-h15.wic"
            "hailo-update-image-astrial-h15.swu"
            "fitImage-astrial-h15.bin"
            "u-boot-initial-env-astrial-h15"
            "hailo15_uart_recovery_fw.bin"
            "hailo15_scu_bl.bin"
            "scu_bl_cfg_a.bin"
            "hailo15_scu_fw.bin"
            "u-boot.dtb.signed"
            "u-boot-spl.bin"
            "u-boot-initial-env"
            "customer_certificate.bin"
            "u-boot-tfa.itb"
          )

          echo "Validating release artifacts in ${DEPLOY}"

          for artifact in "${required_artifacts[@]}"; do
            artifact_path="${DEPLOY}/${artifact}"

            if [ ! -s "${artifact_path}" ]; then
              echo "::error file=${artifact_path}::Required release artifact is missing or empty"
              exit 1
            fi

            ls -lh "${artifact_path}"
          done

          required_scripts=(
            "meta-sysele-bsp/scripts/hailo15_spi_flash_program"
            "meta-sysele-bsp/scripts/program_spi_flash.sh"
            "meta-sysele-bsp/scripts/tftp_server.py"
            "meta-sysele-bsp/scripts/uart_boot_fw_loader"
          )

          for script in "${required_scripts[@]}"; do
            if [ ! -s "${script}" ]; then
              echo "::error file=${script}::Required release script is missing or empty"
              exit 1
            fi
          done

          echo "All required release artifacts are present."

      - name: Build the SBOMs
        if: inputs.sbom != 'none'
        run: bash meta-sysele-bsp/ci/build-sboms.sh

      - name: Archive Build Artifacts
        id: upload_build
        uses: actions/upload-artifact@v4
        with:
          name: astrial-h15-yocto-build
          path: |
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/core-image-hailo-dev-astrial-h15.wic
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/hailo-update-image-astrial-h15.swu
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/fitImage-astrial-h15.bin
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/u-boot-initial-env-astrial-h15
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/hailo15_uart_recovery_fw.bin
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/hailo15_scu_bl.bin
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/scu_bl_cfg_a.bin
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/hailo15_scu_fw.bin
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/u-boot.dtb.signed
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/u-boot-spl.bin
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/u-boot-initial-env
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/customer_certificate.bin
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/u-boot-tfa.itb
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/*.spdx.json
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/*.spdx.index.json
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/*.spdx.tar.zst
            meta-hailo-soc/build/tmp/log/cve/cve-summary.json
            meta-hailo-soc/build/tmp/log/cve/cve-summary
            meta-sysele-bsp/scripts/
          if-no-files-found: error

      - name: Archive SBOMs
        id: upload_sbom
        if: inputs.sbom != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: astrial-h15-sbom
          path: |
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/core-image-hailo-dev-astrial-h15-build.spdx.json
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/core-image-hailo-dev-astrial-h15-deployed.spdx.json
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/*.spdx.tar.zst
            meta-hailo-soc/build/tmp/log/cve/cve-summary.json
          if-no-files-found: error

      - name: Archive Build Logs
        id: upload_logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astrial-h15-build-logs
          path: |
            meta-hailo-soc/build/tmp/log/
            meta-hailo-soc/build/buildhistory/
            failure-logs/
          if-no-files-found: warn

      - name: Download Links
        if: always()
        env:
          BUILD_URL: ${{ steps.upload_build.outputs.artifact-url }}
          LOGS_URL: ${{ steps.upload_logs.outputs.artifact-url }}
          SBOM_URL: ${{ steps.upload_sbom.outputs.artifact-url }}
        run: |
          echo "Image and flashing files: ${BUILD_URL:-not produced, the build did not get that far}"
          echo "Build logs:               ${LOGS_URL:-not produced}"
          echo "SBOMs and CVE report:     ${SBOM_URL:-not produced, this build did not make one}"

      - name: Download Build Artifacts for Release
        if: inputs.release != 'none'
        uses: actions/download-artifact@v4
        with:
          name: astrial-h15-yocto-build
          path: ./release-files

      - name: Create Compressed Release Archive
        if: inputs.release != 'none'
        run: |
          cd release-files
          # Flatten the nested directories upload-artifact produces, so the
          # release archive has files at the top level, not a deep tree.
          if [ -d "meta-sysele-bsp/scripts" ]; then
            cp -p meta-sysele-bsp/scripts/* .
          fi
          cp -p meta-hailo-soc/build/tmp/deploy/images/astrial-h15/* . 2>/dev/null || true
          cp -rp meta-hailo-soc/build/tmp/log/cve/* . 2>/dev/null || true
          rm -rf meta-hailo-soc meta-sysele-bsp
          chmod +x *.sh *.py hailo15_* uart_* 2>/dev/null || true

          # Fail the step rather than publish an incomplete archive: these
          # are exactly the files the release notes promise.
          for f in core-image-hailo-dev-astrial-h15.wic hailo-update-image-astrial-h15.swu \
                   u-boot-tfa.itb scu_bl_cfg_a.bin program_spi_flash.sh; do
            [ -e "$f" ] || { echo "ERROR: $f missing from the archive after flattening" >&2; exit 1; }
          done
          # Stable name for the continuous release, so the asset is replaced
          # instead of accumulating. A tagged release includes the tag.
          if [ "${{ inputs.release }}" = "tagged" ]; then
            NAME="astrial-h15-yocto-build-${{ github.ref_name }}"
          else
            NAME="astrial-h15-yocto-build-continuous"
          fi
          echo "ARCHIVE_NAME=$NAME" >> "$GITHUB_ENV"
          tar -czf "../$NAME.tar.gz" .
          cd ..
          ls -lh "$NAME.tar.gz"

      - name: Read the board tools version expected by the flashing script
        if: inputs.release != 'none'
        run: |
          set -euo pipefail
          V=$(sed -n 's/^HAILO_BOARD_TOOLS_VERSION="\(.*\)"$/\1/p' \
              release-files/program_spi_flash.sh)
          if [ -z "$V" ]; then
            echo "ERROR: no HAILO_BOARD_TOOLS_VERSION in release-files/program_spi_flash.sh" >&2
            echo "       Either the script is missing from the archive, or the variable was renamed." >&2
            exit 1
          fi
          echo "BOARD_TOOLS_VERSION=$V" >> "$GITHUB_ENV"
          echo "board tools version: $V"

      - name: Update the continuous prerelease
        if: inputs.release == 'continuous'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: continuous
          target_commitish: ${{ github.sha }}
          name: Continuous build of ${{ github.ref_name }}
          body: |
            Latest automatic build of `${{ github.ref_name }}`. **Not a release.**

            This one entry is rewritten on every build, so the link never changes and no
            tags accumulate. For a fixed version, take a `v*` release instead.

            - Commit: ${{ github.sha }}
            - Built: ${{ github.event.head_commit.timestamp }}
            - Board tools required: `hailo15_board_tools` ${{ env.BOARD_TOOLS_VERSION }},
              from the Hailo Vision Processor Software Package. See the README.
          files: ${{ env.ARCHIVE_NAME }}.tar.gz
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the release for the pushed tag
        if: inputs.release == 'tagged'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Astrial H15 BSP ${{ github.ref_name }}
          body: |
            **Stack:**
            - Yocto: kirkstone (poky `yocto-4.0.35`)
            - meta-hailo: `kirkstone_v5.3.0`
            - Hailo Vision Processor package: 1.12.0
            - Kernel: 5.15.32

            **Build Information:**
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Build Date: ${{ github.event.head_commit.timestamp }}

            **Download and extract ${{ env.ARCHIVE_NAME }}.tar.gz to get:**
            - `core-image-hailo-dev-astrial-h15.wic`: Complete SD card image for initial provisioning or recovery
            - `hailo-update-image-astrial-h15.swu`: SWUpdate package for updating an already running device
            - `fitImage-astrial-h15.bin`: Kernel and device tree
            - `hailo15_uart_recovery_fw.bin`: UART recovery firmware
            - `hailo15_scu_bl.bin`: SCU bootloader
            - `scu_bl_cfg_a.bin`: SCU bootloader configuration
            - `hailo15_scu_fw.bin`: SCU firmware
            - `u-boot.dtb.signed`: Signed U-Boot device tree
            - `u-boot-spl.bin`: U-Boot SPL
            - `u-boot-initial-env`: U-Boot initial environment
            - `customer_certificate.bin`: Customer certificate
            - `u-boot-tfa.itb`: U-Boot TFA
            - `scu_bl_cfg_b.bin`, `scu_bl_cfg_a_remote_update.bin`: the other SCU bootloader configurations
            - `*-build.spdx.json`, `*-deployed.spdx.json`: software bill of materials, SPDX 2.2
            - `cve-summary.json`, `cve-summary`: the CVE report for the recipes in the image

            The two SBOMs describe different things. **Build** lists every package bitbake built,
            **Deployed** only what the image ships, which is the one to hand to someone asking what
            runs on the board. The same files are also attached to the build as the smaller
            `astrial-h15-sbom` artifact, for anyone who does not want the whole archive.

            **Prerequisite, not included in the archive:** flashing the SPI needs Hailo's
            `hailo15_board_tools` Python package, version **${{ env.BOARD_TOOLS_VERSION }}**.
            Take it from the Hailo Vision Processor Software Package for Hailo-15H on the
            [Hailo Developer Zone](https://hailo.ai/developer-zone/software-downloads/) and
            install it as described in the README. `program_spi_flash.sh` checks for it and
            stops with instructions if it is missing.
          files: ${{ env.ARCHIVE_NAME }}.tar.gz
          # A release candidate is tagged with a -rc suffix, e.g. v1.2.0-rc1.
          prerelease: ${{ contains(github.ref_name, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
