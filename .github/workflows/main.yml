name: Astrial H15 Yocto Build and Release

run-name: Astrial H15 Build • ${{ github.ref_name }} • ${{ github.event_name }}

# Official builds: no-cache, end-to-end validation + tag/prerelease publishing.
# The biweekly schedule is a from-scratch validation run.
on:
  workflow_dispatch:
  push:
    branches:
      # kirkstone is the name we're moving to; master stays until the rename
      # happens, so the transition doesn't turn off CI.
      - kirkstone
      - master
  schedule:
    # Canary: checks that the default branch still builds. Publishes nothing permanent.
    - cron: '0 2 1,15 * *'  # Twice a month, 2 AM UTC (only on default branch)

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
    with:
      release: continuous
      use_cache: false
    secrets: inherit
